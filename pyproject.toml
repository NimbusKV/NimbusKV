[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbuskv"
version = "3.1.0"
description = "Reactive, TTL-aware, concurrent key/value store for Python. Lock-free reads always; one short lock per write; correct on GIL and free-threaded Python (3.13t/3.14t)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Hemanshu Vaidya", email = "hemanshuvaidya64@gmail.com" }
]
dependencies = [
    "immutables>=0.20"
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Operating System :: OS Independent"
]

[project.optional-dependencies]
redis = ["redis>=4.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "fakeredis>=2.0"]

[project.urls]
Homepage = "https://nimbuskv.fyi"
Documentation = "https://nimbuskv.fyi/readme/python/3.1.0"
Source = "https://github.com/NimbusKV/NimbusKV"
Issues = "https://github.com/NimbusKV/NimbusKV/issues"
Releases = "https://github.com/NimbusKV/NimbusKV/releases"

[tool.setuptools]
packages = ["nimbuskv", "nimbuskv.modules"]

[tool.setuptools.package-data]
nimbuskv = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
