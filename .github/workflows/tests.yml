name: Tests

on:
  push:
    branches: [latest, main]
  pull_request:
  workflow_dispatch:

jobs:
  test-standard:
    name: "Python ${{ matrix.python-version }} (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio fakeredis

      - name: Run tests
        run: pytest tests/ -v

  test-free-threaded:
    name: "Python ${{ matrix.python-version }} (free-threaded, ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    # Free-threaded CPython is still experimental (PEP 703). This job
    # is what actually proves the headline claim of this library --
    # correct on the no-GIL runtime -- so it's not just decorative CI;
    # continue-on-error is set because free-threaded builds can be
    # flaky in CI infrastructure independent of NimbusKV's own
    # correctness, and a runner-level hiccup here shouldn't block PRs.
    continue-on-error: true
    env:
      # immutables (our one dependency) has not declared free-threading
      # support, so importing it silently re-enables the GIL. Force it
      # off so this job actually tests the no-GIL runtime.
      PYTHON_GIL: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13t", "3.14t"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up free-threaded Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio fakeredis

      - name: Confirm GIL is still disabled after importing nimbuskv
        # Checked after the import on purpose: a C extension can turn
        # the GIL back on at import time, which a pre-import check misses.
        run: |
          python -c "import sys, nimbuskv; print(sys.version); assert sys._is_gil_enabled() is False, 'GIL re-enabled by an import'"

      - name: Run tests on free-threaded Python
        run: pytest tests/ -v

      - name: Run write-path benchmark
        run: python bench/b06_write_path.py
